<footer class="footer">
  <div class="footer-container">
    <div class="footer-content">
      <!-- Column 1: Company Information -->
      <div class="footer-column footer-company">
        <div class="footer-logo">Kindly Yours</div>
        <div class="footer-contact-info">
          <div class="contact-item">
            <svg class="contact-icon" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
            </svg>
            <span>{{ address }}</span>
          </div>
          <div class="contact-item">
            <svg class="contact-icon" fill="currentColor" viewBox="0 0 20 20">
              <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"/>
            </svg>
            <span>{{ hotline }}</span>
          </div>
          <div class="contact-item">
            <svg class="contact-icon" fill="currentColor" viewBox="0 0 20 20">
              <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
              <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
            </svg>
            <span>{{ email }}</span>
          </div>
        </div>
      </div>

      <!-- Column 2: Quick Links -->
      <div class="footer-column footer-links">
        <h3 class="footer-column-title">LIÊN KẾT NHANH</h3>
        <ul class="footer-links-list">
          <li *ngFor="let link of quickLinks">
            <a [routerLink]="link.href" class="footer-link">{{ link.label }}</a>
          </li>
        </ul>
      </div>

      <!-- Column 3: Contact & Social Media -->
      <div class="footer-column footer-contact">
        <h3 class="footer-column-title">LIÊN HỆ</h3>
        <p class="contact-message">Bạn có thắc mắc chưa được giải quyết?</p>
        <p class="online-hours">Chúng tôi online 24/7 từ thứ 2 tới thứ 7</p>
        <div class="social-media-icons">
          <a [href]="socialMedia.facebook" target="_blank" rel="noopener noreferrer" class="social-icon facebook-icon" aria-label="Facebook">
            <svg fill="currentColor" viewBox="0 0 24 24" width="20" height="20">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
          </a>
          <a [href]="socialMedia.tiktok" target="_blank" rel="noopener noreferrer" class="social-icon tiktok-icon" aria-label="TikTok">
            <svg fill="currentColor" viewBox="0 0 24 24" width="20" height="20">
              <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-5.2 1.74 2.89 2.89 0 012.31-4.64 2.93 2.93 0 01.88.13V9.4a6.84 6.84 0 00-1-.05A6.33 6.33 0 005 20.1a6.34 6.34 0 0010.86-4.43v-7a8.16 8.16 0 004.77 1.52v-3.4a4.85 4.85 0 01-1-.1z"/>
            </svg>
          </a>
         
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Chat Icons -->
  <div class="floating-chat-icons">
    <a [href]="'https://zalo.me/' + zalo" target="_blank" rel="noopener noreferrer" class="floating-icon zalo-icon" aria-label="Zalo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Icon_of_Zalo.svg/1200px-Icon_of_Zalo.svg.png" alt="Zalo" width="24" height="24" style="display:block; width:24px; height:24px; border-radius: 50%;"/>
    </a>
    <a [href]="'https://m.me/' + messengerId" target="_blank" rel="noopener noreferrer" class="floating-icon messenger-icon" aria-label="Messenger">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/be/Facebook_Messenger_logo_2020.svg/1024px-Facebook_Messenger_logo_2020.svg.png" alt="Messenger" width="24" height="24" style="display:block; width:24px; height:24px;"/>
    </a>
  </div>

  <!-- Chatbot Widget -->
  <app-chatbot></app-chatbot>
</footer>
