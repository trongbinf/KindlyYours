<header class="header">
  <!-- Top Section - Dark Red Background -->
  <div class="header-top-bar">
    <div class="header-top-container">
      <!-- Left: Hotline -->
      <div class="top-bar-item">
        <svg class="top-bar-icon" fill="currentColor" viewBox="0 0 20 20">
          <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"/>
        </svg>
        <span>Hotline đặt hàng: {{ hotline }}</span>
      </div>

      <!-- Center: Divider and Address -->
      <div class="top-bar-divider"></div>
      <div class="top-bar-item">
        <svg class="top-bar-icon" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
        </svg>
        <span>{{ address }}</span>
      </div>

      <!-- Right: Social Media -->
      <div class="top-bar-item top-bar-social">
        <span class="social-label">Mạng xã hội</span>
        <a [href]="socialMedia.facebook" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Facebook">
          <svg fill="currentColor" viewBox="0 0 24 24" width="20" height="20">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </a>
        <a [href]="socialMedia.instagram" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Instagram">
          <svg fill="currentColor" viewBox="0 0 24 24" width="20" height="20">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </a>
        <a [href]="socialMedia.tiktok" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="TikTok">
          <svg fill="currentColor" viewBox="0 0 24 24" width="20" height="20">
            <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-5.2 1.74 2.89 2.89 0 012.31-4.64 2.93 2.93 0 01.88.13V9.4a6.84 6.84 0 00-1-.05A6.33 6.33 0 005 20.1a6.34 6.34 0 0010.86-4.43v-7a8.16 8.16 0 004.77 1.52v-3.4a4.85 4.85 0 01-1-.1z"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <!-- Bottom Section - White Background with Navigation -->
  <div class="header-nav-bar">
    <div class="header-nav-container">
      <div class="nav-bar-content">
      <!-- Logo -->
      <div class="logo-section">
        <a routerLink="/" class="logo-link">
            <span class="logo-text">Teamo</span>
        </a>
      </div>

      <!-- Desktop Navigation -->
      <nav class="nav-desktop">
        <a *ngFor="let link of navLinks" 
           [routerLink]="link.href" 
           routerLinkActive="active"
           class="nav-link">
          {{ link.label }}
            <span *ngIf="link.hasDropdown" class="dropdown-arrow">▼</span>
        </a>
      </nav>

        <!-- Right Actions -->
        <div class="header-actions">
          <button class="create-gift-btn">
            <svg class="btn-icon" fill="currentColor" viewBox="0 0 20 20">
              <path d="M10 3.5a1.5 1.5 0 013 0V4a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-.5a1.5 1.5 0 000 3h.5a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-.5a1.5 1.5 0 00-3 0v.5a1 1 0 01-1 1H6a1 1 0 01-1-1v-3a1 1 0 00-1-1h-.5a1.5 1.5 0 010-3H4a1 1 0 001-1V6a1 1 0 011-1h3a1 1 0 001-1v-.5z"/>
            </svg>
            <span>Tự làm hộp quà</span>
          </button>
          <button class="cart-icon-btn" aria-label="Shopping Cart">
            <svg class="cart-icon" fill="currentColor" viewBox="0 0 20 20">
              <path d="M3 1a1 1 0 000 2h1.22l.305 1.222a.997.997 0 00.01.042l1.358 5.43-.893 2.857A1 1 0 006 14h11a1 1 0 00.949-.684l1-4A1 1 0 0017 8H6.39l-.15-.604A1 1 0 005 7H3zM6 16a2 2 0 100 4 2 2 0 000-4zm13 0a2 2 0 100 4 2 2 0 000-4z"/>
            </svg>
          </button>
        </div>

      <!-- Mobile Menu Toggle -->
      <button class="mobile-menu-toggle" 
              (click)="toggleMobileMenu()"
              [class.active]="mobileMenuOpen"
              aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <!-- Mobile Navigation -->
    <nav class="nav-mobile" [class.open]="mobileMenuOpen">
      <a *ngFor="let link of navLinks" 
         [routerLink]="link.href" 
         routerLinkActive="active"
         (click)="toggleMobileMenu()"
         class="nav-link-mobile">
        {{ link.label }}
          <span *ngIf="link.hasDropdown" class="dropdown-arrow">▼</span>
      </a>
    </nav>
    </div>
  </div>
</header>
