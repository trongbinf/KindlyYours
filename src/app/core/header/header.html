<header class="header">
  <!-- Top Section - Dark Red Background -->
  <div class="header-top-bar">
    <div class="header-top-container">
      <!-- Left: Hotline -->
      <div class="top-bar-item">
        <svg class="top-bar-icon" fill="currentColor" viewBox="0 0 20 20">
          <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"/>
        </svg>
        <span>Hotline đặt hàng: {{ hotline }}</span>
      </div>

      <!-- Center: Divider and Address -->
      <div class="top-bar-divider"></div>
      <div class="top-bar-item">
        <svg class="top-bar-icon" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
        </svg>
        <span>{{ address }}</span>
      </div>

      <!-- Right: Social Media -->
      <div class="top-bar-item top-bar-social">
        <span class="social-label">Mạng xã hội</span>
        <a [href]="socialMedia.facebook" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Facebook">
          <svg fill="currentColor" viewBox="0 0 24 24" width="20" height="20">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </a>
        <a [href]="socialMedia.tiktok" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="TikTok">
          <svg fill="currentColor" viewBox="0 0 24 24" width="20" height="20">
            <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-5.2 1.74 2.89 2.89 0 012.31-4.64 2.93 2.93 0 01.88.13V9.4a6.84 6.84 0 00-1-.05A6.33 6.33 0 005 20.1a6.34 6.34 0 0010.86-4.43v-7a8.16 8.16 0 004.77 1.52v-3.4a4.85 4.85 0 01-1-.1z"/>
          </svg>
        </a>
       
      </div>
    </div>
  </div>

  <!-- Bottom Section - White Background with Navigation -->
  <div class="header-nav-bar">
    <div class="header-nav-container">
      <div class="nav-bar-content">
      <!-- Logo -->
      <div class="logo-section">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="logo-link">
            <img src="https://res.cloudinary.com/dvjknvfiz/image/upload/v1762677617/Thie%CC%82%CC%81t_ke%CC%82%CC%81_chu%CC%9Ba_co%CC%81_te%CC%82n__3_-removebg-preview_n7k5hn.png" alt="Kindly Yours" class="logo-text">
        </a>
      </div>

      <!-- Desktop Navigation -->
      <nav class="nav-desktop">
        <ng-container *ngFor="let link of navLinks">
          <!-- Normal link -->
          <a *ngIf="!link.hasDropdown"
             [routerLink]="link.href"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }"
             class="nav-link">
            {{ link.label }}
          </a>

          <!-- Link with optional mega dropdown -->
          <div *ngIf="link.hasDropdown"
               class="nav-link-with-dropdown"
               (mouseenter)="openDropdown(link.key)"
               (mouseleave)="closeDropdown()">
            <a [routerLink]="link.href" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
              {{ link.label }}
              <span class="dropdown-arrow">▼</span>
            </a>
            <!-- Giftbox dropdown (only for giftbox link) -->
            <div class="mega-dropdown" *ngIf="link.key==='giftbox' && activeDropdown==='giftbox'">
              <div class="mega-column">
                <div class="mega-title">Quà tặng theo người nhận</div>
                <a class="mega-item" *ngFor="let r of giftboxRecipients" [routerLink]="'/collections/giftboxes'">{{ r }}</a>
              </div>
              <div class="mega-column">
                <div class="mega-title">Quà tặng theo dịp</div>
                <a class="mega-item" *ngFor="let o of giftboxOccasions" [routerLink]="'/collections/giftboxes'">{{ o }}</a>
              </div>
            </div>

            <!-- Corporate dropdown (only for corporate link) -->
            <div class="mega-dropdown corporate" *ngIf="link.key==='corporate' && activeDropdown==='corporate'">
              <div class="mega-column">
                <div class="mega-title">Doanh nghiệp</div>
                <a class="mega-item" *ngFor="let c of corporateLinks" [routerLink]="'/corporate-gifts'">{{ c }}</a>
              </div>
            </div>
          </div>
        </ng-container>
        
        <!-- Search Box -->
        <div class="search-box">
          <input 
            type="text" 
            [(ngModel)]="searchQuery"
            (keyup.enter)="onSearch()"
            placeholder="Tìm kiếm sản phẩm..." 
            class="search-input">
          <button 
            type="button" 
            (click)="onSearch()"
            class="search-btn" 
            aria-label="Search">
            <svg class="search-icon" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
            </svg>
          </button>
        </div>
      </nav>

        <!-- Right Actions -->
        <div class="header-actions">
          <button class="create-gift-btn shake-animation" routerLink="/create-gift-box">
            <svg class="btn-icon gift-icon" fill="currentColor" viewBox="0 0 24 24">
              <path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-2 .89-2 2v1c0 1.11.89 2 2 2v10c0 1.11.89 2 2 2h12c1.11 0 2-.89 2-2V11c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm6 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM4 8h16v1H4V8zm2 3h3v10H6V11zm5 0h3v10h-3V11zm5 0h2v10h-2V11z"/>
            </svg>
            <span>Tự làm hộp quà</span>
          </button>
          <button class="cart-btn" (click)="openCart()" aria-label="Shopping Cart">
            <svg class="cart-icon" fill="currentColor" viewBox="0 0 24 24">
              <path d="M19,7H16V6A4,4 0 0,0 12,2A4,4 0 0,0 8,6V7H5A1,1 0 0,0 4,8V19A3,3 0 0,0 7,22H17A3,3 0 0,0 20,19V8A1,1 0 0,0 19,7M10,6A2,2 0 0,1 12,4A2,2 0 0,1 14,6V7H10V6M18,19A1,1 0 0,1 17,20H7A1,1 0 0,1 6,19V9H8V10A1,1 0 0,0 9,11A1,1 0 0,0 10,10V9H14V10A1,1 0 0,0 15,11A1,1 0 0,0 16,10V9H18V19Z"/>
            </svg>
            <span *ngIf="cartCount > 0" class="cart-badge">{{ cartCount }}</span>
          </button>
        </div>

      <!-- Mobile Menu Toggle -->
      <button class="mobile-menu-toggle" 
              (click)="toggleMobileMenu()"
              [class.active]="mobileMenuOpen"
              aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <!-- Mobile Navigation -->
    <nav class="nav-mobile" [class.open]="mobileMenuOpen">
      <!-- Mobile Search -->
      <div class="mobile-search-container">
        <div class="mobile-search-box">
          <input 
            type="text" 
            [(ngModel)]="searchQuery"
            (keyup.enter)="onSearch(); toggleMobileMenu()"
            placeholder="Tìm kiếm sản phẩm..." 
            class="mobile-search-input">
          <button 
            type="button" 
            (click)="onSearch(); toggleMobileMenu()"
            class="mobile-search-btn" 
            aria-label="Search">
            <svg class="search-icon" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
            </svg>
          </button>
        </div>
      </div>
      
      <a *ngFor="let link of navLinks" 
         [routerLink]="link.href" 
         routerLinkActive="active"
         (click)="toggleMobileMenu()"
         class="nav-link-mobile">
        {{ link.label }}
          <span *ngIf="link.hasDropdown" class="dropdown-arrow">▼</span>
      </a>
      
      <!-- Mobile Action Buttons -->
      <div class="mobile-actions">
        <button class="mobile-create-gift-btn shake-animation" routerLink="/create-gift-box" (click)="toggleMobileMenu()">
          <svg class="btn-icon gift-icon" fill="currentColor" viewBox="0 0 24 24">
            <path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-2 .89-2 2v1c0 1.11.89 2 2 2v10c0 1.11.89 2 2 2h12c1.11 0 2-.89 2-2V11c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm6 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM4 8h16v1H4V8zm2 3h3v10H6V11zm5 0h3v10h-3V11zm5 0h2v10h-2V11z"/>
          </svg>
          <span>Tự làm hộp quà</span>
        </button>
      </div>
    </nav>
    </div>
  </div>
</header>
